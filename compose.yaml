services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # NOTE: 秘密情報は .env 経由では渡さない。コマンドライン引数か、 run -e DISCORD_BOT_TOKEN で明示的に渡す。
    # env_file:
    #   - .env
    environment:
      # .pyc 作らない。
      PYTHONDONTWRITEBYTECODE: "1"
      # stdout/stderr バッファしない。
      PYTHONUNBUFFERED: "1"
      # 仮想環境をプロジェクト直下 (/app/.venv) に作ります。
      PIPENV_VENV_IN_PROJECT: "1"
    working_dir: /app
    volumes:
      - ./:/app
      # こっち↑は bind mount. (いつも同期。)
      # こっち↓は anonymous volume. コンテナの中の、このボリュームだけは、同期しないよって設定。
      # NOTE: Dockerfile で予め pipenv sync する作りにしてる。そのあとマウントで、上書きしちゃわないようにしています。
      #       この方式だと、たとえば、コンテナの中の venv も動くし、ホスト側で pipenv sync しても、コンテナ内とは
      #       同期されないから、別々の環境で main.py を動かすことだってできる。
      - /app/.venv
    # コンテナを起動したままにする……のは今回は (ジョブ実行型なので) 不要。
    # tty: true
    # stdin_open: true

  # Web UI (main_101_web_ui.py) 用のサービスです。
  # NOTE: run はデフォルトで ports を公開しないので、 --service-ports が必要。
  #       docker compose run --rm --service-ports web
  #       ホスト側の 8000 が埋まってたら docker compose run --rm -p 127.0.0.1:8080:8000 web とかで回避する。
  web:
    # 基本は app と同じ。
    extends:
      service: app
    # ただ、起動した瞬間にこれ↓を実行する。
    command: pipenv run python main_101_web_ui.py
    # uvicorn が 8000 (右) で待っているので、そことホストの 8000 (左) をつなぐ。
    # NOTE: web UI は bot token を返すので、ホストの 127.0.0.1 にだけ公開します。 (LAN から見えないように。)
    ports:
      - "127.0.0.1:8000:8000"
